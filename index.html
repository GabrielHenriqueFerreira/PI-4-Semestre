<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Paraflow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <section class="painel-login">
      <h1 class="logo" aria-label="Paraflow">
        <span class="para">PARA</span><span class="flow">FLOW</span>
      </h1>

      <form class="form" id="form-login" novalidate>
        <h2>Olá, seja bem-vindo</h2>

        <div class="campo">
          <label for="usuario">Usuário</label>
          <input id="usuario" type="text" autocomplete="username" required />
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="senha-wrap">
            <input id="senha" type="password" autocomplete="current-password" required />
            <button type="button" class="toggle" aria-pressed="false">Mostrar</button>
          </div>
        </div>

        <p class="erro" id="erro" role="alert" hidden></p>

        <div class="opcoes">
          <label class="lembrar"><input type="checkbox" /> Lembrar de mim</label>
          <a href="#">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn btn-principal">Entrar</button>

        <div class="divisor"><span>ou</span></div>

        <a href="cadastro.html" class="btn btn-secundario">Cadastrar</a>
      </form>
    </section>

    <section class="painel-ilustracao" aria-hidden="true"></section>
  </main>

  <script>
    const form = document.getElementById('form-login');
    const usuario = document.getElementById('usuario');
    const senha = document.getElementById('senha');
    const erro = document.getElementById('erro');
    const toggle = document.querySelector('.toggle');
    const entrar = form.querySelector('.btn-principal');

    toggle.addEventListener('click', () => {
      const mostrando = senha.type === 'text';
      senha.type = mostrando ? 'password' : 'text';
      toggle.textContent = mostrando ? 'Mostrar' : 'Ocultar';
      toggle.setAttribute('aria-pressed', String(!mostrando));
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.hidden = true;

      if (!usuario.value.trim() || !senha.value) {
        erro.textContent = 'Preencha usuário e senha.';
        erro.hidden = false;
        (usuario.value.trim() ? senha : usuario).focus();
        return;
      }

      entrar.disabled = true;
      entrar.textContent = 'Entrando...';
      // TODO: chamar sua API aqui
      await new Promise((r) => setTimeout(r, 1000));
      entrar.disabled = false;
      entrar.textContent = 'Entrar';
    });
  </script>
</body>
</html>
